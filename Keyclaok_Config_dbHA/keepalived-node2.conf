# =============================================================================
# keepalived.conf  ── Node2 (원래 Standby, 평상시 BACKUP)
# 설치 위치: /etc/keepalived/keepalived.conf
# -----------------------------------------------------------------------------
# Node1과의 차이: state BACKUP, priority 낮음, unicast 방향 반대.
# =============================================================================

global_defs {
    script_user root
}

vrrp_script chk_db {
    script "/usr/bin/pg_isready -h 127.0.0.1 -p 5432 -U keycloak"
    interval 2
    timeout 3
    fall 3
    rise 2
    weight -60        # Node1과 동일하게 맞춤 (DB 단독 장애 시 failover 일관성)
}

vrrp_instance VI_KC {
    # Node1과 동일하게 state BACKUP. priority 만 낮다.
    #  - nopreempt는 priority 높은 Node1에만 필요(낮은 Node2는 애초에 preempt 안 함).
    #  - cold start 시: Node1(150) > Node2(100) 이라 Node1이 MASTER 차지.
    state BACKUP
    interface ens5
    virtual_router_id 51           # Node1과 동일
    priority 100                   # MASTER(150)보다 낮게
    advert_int 1

    unicast_src_ip 10.10.0.22      # 이 노드(Node2) 사설IP
    unicast_peer {
        10.10.0.21                 # 상대(Node1) 사설IP
    }

    authentication {
        auth_type PASS
        auth_pass kcha2026         # Node1과 동일 (최대 8자)
    }

    track_script {
        chk_db
    }

    notify "/bin/bash /etc/keepalived/keepalived-notify.sh"
}
