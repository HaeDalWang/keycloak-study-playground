# =============================================================================
# keepalived.conf  ── Node1 (원래 Primary, 평상시 MASTER)
# 설치 위치: /etc/keepalived/keepalived.conf
# -----------------------------------------------------------------------------
# AWS VPC는 멀티캐스트 미지원 → unicast VRRP 사용.
# VIP는 keepalived가 ARP로 못 옮기므로 virtual_ipaddress 대신
# notify_master 스크립트에서 AWS CLI로 이동시킨다(keepalived-notify.sh).
# =============================================================================

# 로컬 서비스(postgres) 살아있는지 체크 → 죽으면 우선순위 떨궈 BACKUP에 양보
global_defs {
    # notify/track 스크립트를 root로 실행 (ip addr / docker / aws 권한 필요).
    # 없으면 keepalived가 'keepalived_script' 유저를 찾다 경고/실패.
    script_user root
}

vrrp_script chk_db {
    script "/usr/bin/pg_isready -h 127.0.0.1 -p 5432 -U keycloak"
    interval 2
    timeout 3
    fall 3        # 3회 연속 실패 → 장애로 판정
    rise 2
    # 실패 시 priority 에서 60 차감 → 150-60=90 < Node2(100) 이므로 DB 단독 장애에도 failover 동작.
    # (만약 -40이면 150-40=110 > 100 이라 DB만 죽었을 때 안 넘어감)
    weight -60
}

vrrp_instance VI_KC {
    # state BACKUP + nopreempt: 한번 MASTER 잃으면 자동으로 도로 뺏지 않는다.
    #  - Node1이 죽었다 살아나면 그 DB는 stale(낡음)이다. 자동 복귀하면 VIP가
    #    낡은 DB로 돌아가 데이터가 꼬인다. → 반드시 수동 리커버리(README-HA.md).
    #  - cold start(둘 다 동시에 부팅) 시엔 priority 높은 Node1이 MASTER가 된다.
    state BACKUP
    interface ens5                 # AWS Nitro(t3)는 ens5. `ip route show default` 로 확인
    virtual_router_id 51           # 두 노드 동일해야 함
    priority 150                   # 초기 cold start 시 더 높은 쪽이 MASTER
    advert_int 1
    nopreempt                      # 자동 되찾기 금지

    # 멀티캐스트 대신 unicast
    unicast_src_ip 10.10.0.21      # 이 노드(Node1) 사설IP
    unicast_peer {
        10.10.0.22                 # 상대(Node2) 사설IP
    }

    authentication {
        auth_type PASS
        auth_pass kcha2026         # 두 노드 동일 (VRRP auth_pass는 최대 8자)
    }

    track_script {
        chk_db
    }

    # 상태 전이 시 호출. 인자: <type> <name> <state>
    # bash로 감싸 실행: shebang/CRLF/실행권한 문제로 인한 'Exec format error' 회피.
    #  keepalived가 뒤에 <TYPE> <NAME> <STATE> 인자를 붙이며, bash 경유해도 그대로 전달됨.
    notify "/bin/bash /etc/keepalived/keepalived-notify.sh"
}
