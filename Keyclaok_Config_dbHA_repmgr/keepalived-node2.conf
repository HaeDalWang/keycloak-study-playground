# =============================================================================
# keepalived.conf  ── Node2 (repmgr 버전, 최초 Standby)
# 설치 위치: /etc/keepalived/keepalived.conf
# -----------------------------------------------------------------------------
# Node1과 거의 동일. unicast 방향만 반대.
# priority 도 Node1과 같다(100) — 누가 VIP를 갖는지는 chk_primary 가 정한다.
# =============================================================================

global_defs {
    script_user root
}

vrrp_script chk_primary {
    script "/bin/bash /etc/keepalived/check-primary.sh"
    interval 5
    timeout 5
    fall 2
    rise 1
    weight 50
}

vrrp_instance VI_KC {
    state BACKUP
    interface ens5
    virtual_router_id 51           # Node1과 동일
    priority 100                   # ★ Node1과 동일
    advert_int 1
    # nopreempt 없음 (repmgr 버전 공통)

    unicast_src_ip 10.10.0.22      # 이 노드(Node2) 사설IP
    unicast_peer {
        10.10.0.21                 # 상대(Node1) 사설IP
    }

    authentication {
        auth_type PASS
        auth_pass kcha2026
    }

    track_script {
        chk_primary
    }

    notify "/bin/bash /etc/keepalived/keepalived-notify.sh"
}
