# =============================================================================
# Keycloak 설정 파일 (repmgr 레퍼런스 버전)
# -----------------------------------------------------------------------------
# 수동 복제 버전과 keycloak 관점에서는 동일하다. DB는 VIP로 접속.
#  - repmgr이 DB 승격을 자동으로 해줘도, "트래픽을 새 Primary로 보내는 일"은
#    별개다. 그래서 VIP(보조 사설IP)는 여전히 필요하고, keepalived가 옮긴다.
#  - repmgr 자체엔 vip-mgmt 기능이 있지만(repmgr.conf의 promote/follow command),
#    AWS에선 ARP가 안 먹어 결국 AWS CLI 호출이 필요하므로 keepalived로 통일.
# =============================================================================

db=postgres
db-url=jdbc:postgresql://10.10.0.100:5432/keycloak
db-username=keycloak
db-password=keycloak
db-pool-min-size=5
# HA 2노드 기준: (100 × 0.8) ÷ 2 = 40
db-pool-max-size=40

# 앞단 LB가 SSL Termination하는 경우 이므로 true
http-enabled=true
http-port=8080
# 모든 인터페이스에서 수신. 명시 안 하면 VIP 등 보조IP에만 바인딩될 수 있음.
http-host=0.0.0.0
# ALB/SSL termination 없이 HTTP 직접 서비스. 테스트 환경용.
# 운영 전환 시 none → external(LB 뒤) 또는 all(Keycloak 직접 TLS)로 변경.
https-required=none
proxy-headers=xforwarded

hostname=keycloak.seungdobae.com
hostname-strict=true
hostname-strict-backchannel=false

# 캐시 복제 (Infinispan 분산 캐시) + DB 기반 노드 디스커버리
cache=ispn
cache-embedded-mtls-enabled=false
cache-stack=jdbc-ping

log-level=INFO
log=console

health-enabled=true
