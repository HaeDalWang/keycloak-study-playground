# =============================================================================
# keepalived.conf  ── Node1 (repmgr 버전, 최초 Primary)
# 설치 위치: /etc/keepalived/keepalived.conf
# -----------------------------------------------------------------------------
# 수동 버전과의 핵심 차이:
#   1) chk_db("postgres 살아있나") → chk_primary("내가 primary인가") 로 교체
#   2) nopreempt 불필요 — VIP가 node 정체성이 아니라 primary 상태를 따라가므로
#      죽었다 살아난 옛 primary(이제 standby)는 chk_primary 실패 → VIP 안 뺏음
#   3) 두 노드 priority 동일 — 승자는 track_script 가 결정
# =============================================================================

global_defs {
    script_user root
}

vrrp_script chk_primary {
    # "이 노드가 현재 PostgreSQL Primary인가?" → 0이면 성공(+weight)
    # bash로 감싸 실행: shebang/CRLF/실행권한 문제로 인한 'Exec format error' 회피.
    #  (keepalived는 스크립트를 shell 없이 execve 하므로 형식이 조금만 틀려도 깨진다)
    script "/bin/bash /etc/keepalived/check-primary.sh"
    interval 5         # docker exec psql 지연 고려해 넉넉히
    timeout 5
    fall 2
    rise 1
    weight 50          # primary면 +50 (success 시 가산)
}

vrrp_instance VI_KC {
    state BACKUP                   # 양쪽 다 BACKUP, 승자는 priority+weight로 결정
    interface ens5
    virtual_router_id 51
    priority 100                   # ★ 두 노드 동일
    advert_int 1
    # nopreempt 없음! VIP가 primary 상태를 따라가므로 stale 복귀가 원천 차단됨.

    unicast_src_ip 10.10.0.21      # 이 노드(Node1) 사설IP
    unicast_peer {
        10.10.0.22                 # 상대(Node2) 사설IP
    }

    authentication {
        auth_type PASS
        auth_pass kcha2026
    }

    track_script {
        chk_primary                # primary면 100+50=150, standby면 100 → primary가 VIP 차지
    }

    notify "/bin/bash /etc/keepalived/keepalived-notify.sh"
}
